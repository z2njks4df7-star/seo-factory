name: Daily SEO Content Generator

on:
  schedule:
    - cron: '0 3 * * *' # 每天凌晨 3 点 (UTC) 运行 (北京时间 11:00)
  workflow_dispatch: # 允许手动触发

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Set Environment Variables
        run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" >> $GITHUB_ENV

      - name: Run Content Generator
        run: |
          python batch_generate.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'SEO Bot'
          git config --global user.email 'seo-bot@github.com'
          git add docs/
          git diff --staged --quiet || git commit -m "Auto-deploy: New AI content generated [skip ci]"
          git push

      - name: Notify Success
        if: success()
        run: echo "✅ SEO Content updated successfully!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ SEO Content generation failed. Check logs."